name: Daily survey refresh

# 05:30 UTC = 6:30 AM Nigeria time (WAT, UTC+1)
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check survey platforms + rebuild snapshot
        run: python main.py

      - name: Send Telegram digest (skipped if secrets are missing)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python main.py --skip-check --send-telegram
          else
            echo "Telegram secrets not configured - skipping (site data still updated)."
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/surveys.json links.html
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily survey update - $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
